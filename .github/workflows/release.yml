name: Release

on:
  push:
    tags:
      # Version tags such as 0.1.0 (no "v" prefix), matching tauri.conf.json
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          APP_VERSION="$( jq -r .version src-tauri/tauri.conf.json )"
          NPM_VERSION="$( jq -r .version package.json )"
          CARGO_VERSION="$( sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1 )"
          if [[ "${APP_VERSION}" != "${NPM_VERSION}" || "${APP_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "Versions differ: tauri.conf.json ${APP_VERSION}, package.json ${NPM_VERSION}, Cargo.toml ${CARGO_VERSION}" >&2
            exit 1
          fi
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" != "${APP_VERSION}" ]]; then
            echo "Tag ${REF_NAME} does not match tauri.conf.json (${APP_VERSION})" >&2
            exit 1
          fi
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${APP_VERSION}"

  linux:
    needs: version
    # The oldest supported Ubuntu, so the binary links against an old glibc
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache: release builds must not pick up anything another run left behind
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev xvfb x11-utils
      - name: Install packages
        run: npm ci
      - name: Checks and unit tests
        run: |
          npm run check
          cd src-tauri && cargo test --locked
      - name: Build the .deb
        run: npm run tauri build -- --bundles deb
      - name: Launch the app
        run: xvfb-run -a dbus-run-session -- scripts/launch-test.sh src-tauri/target/release/suisha
      - name: Collect the package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          mv src-tauri/target/release/bundle/deb/*.deb "out/suisha-${RELEASE_VERSION}-linux-amd64.deb"
          cd out
          for f in *; do sha256sum "${f}" > "${f}.sha256"; done
          dpkg-deb --info ./*.deb
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No cache: release builds must not pick up anything another run left behind
          package-manager-cache: false
      - name: Add the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install packages
        run: npm ci
      - name: Checks and unit tests
        run: |
          npm run check
          cd src-tauri && cargo test --locked
      - name: Check the cask
        run: |
          ruby -c Casks/suisha.rb
          brew style Casks/suisha.rb
      # One universal app runs on both Apple silicon and Intel Macs
      - name: Build the app
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
      # An invalid signature only shows up as a crash at launch, so check it here
      - name: Verify the signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/universal-apple-darwin/release/bundle/macos/Suisha.app
      - name: Install mas for the launch test
        run: brew install mas
      - name: Launch the app
        run: scripts/launch-test.sh src-tauri/target/universal-apple-darwin/release/bundle/macos/Suisha.app/Contents/MacOS/suisha
      - name: Collect the package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir out
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/suisha-${RELEASE_VERSION}-macos-universal.dmg"
          cd out
          for f in *; do shasum -a 256 "${f}" > "${f}.sha256"; done
          ls -la
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          # Tag pushes make normal releases; manual runs can be pre-releases
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' }}
        run: |
          ls -la dist
          (cd dist && sha256sum -c ./*.sha256)
          NOTES=".github/release-notes/${RELEASE_VERSION}.md"
          if [[ ! -f "${NOTES}" ]]; then
            NOTES="$( mktemp )"
            printf 'Suisha %s\n' "${RELEASE_VERSION}" > "${NOTES}"
          fi
          FLAGS=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "${RELEASE_VERSION}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" dist/* --clobber
          else
            gh release create "${RELEASE_VERSION}" dist/* \
              --title "Suisha ${RELEASE_VERSION}" \
              --notes-file "${NOTES}" \
              --target "${GITHUB_SHA}" \
              "${FLAGS[@]}"
          fi

  apt:
    # Rebuild the signed apt repository on GitHub Pages
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repo.yml
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}

  homebrew:
    # Update the cask in this repository (the tap is
    # `brew tap moriyama-dev/suisha https://github.com/moriyama-dev/suisha`)
    needs: [version, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Update Casks/suisha.rb
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          FILE="suisha-${RELEASE_VERSION}-macos-universal.dmg"
          gh release download "${RELEASE_VERSION}" --pattern "${FILE}.sha256" --dir "${RUNNER_TEMP}"
          SHA="$( cut -d' ' -f1 "${RUNNER_TEMP}/${FILE}.sha256" )"
          sed -i -e "s/^  version \".*\"/  version \"${RELEASE_VERSION}\"/" \
                 -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/suisha.rb
          git diff
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the Homebrew cask to ${RELEASE_VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:main

  homebrew-check:
    # Install the published cask the way people do
    needs: [version, homebrew]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Install with Homebrew
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          brew tap moriyama-dev/suisha "${REPO_URL}"
          brew install --cask moriyama-dev/suisha/suisha
          ls -la /Applications/Suisha.app/Contents/MacOS
          if xattr -p com.apple.quarantine /Applications/Suisha.app 2> /dev/null; then
            echo "The quarantine flag is still set" >&2
            exit 1
          fi
          /Applications/Suisha.app/Contents/MacOS/suisha --version | grep -F "suisha ${RELEASE_VERSION}"
          brew list --cask --versions suisha
          # Installed with Homebrew, Suisha must find that it can update itself.
          /Applications/Suisha.app/Contents/MacOS/suisha --self-check | tee "${RUNNER_TEMP}/self-check.json"
          grep -F '"selfUpdateChannel": "brew"' "${RUNNER_TEMP}/self-check.json"
          brew uninstall --cask moriyama-dev/suisha/suisha
